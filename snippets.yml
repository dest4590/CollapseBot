data-clear:
    title: '🗂️ Очистка данных CollapseLoader'
    content: |
        **Шаги для очистки данных CollapseLoader:**

        1. **Закройте лоадер полностью**
        2. **Перейдите в папку:**
           - Windows: `%appdata%\CollapseLoader\`

        3. **Удалите все файлы**

        4. **Перезапустите лоадер**

        ⚠️ **Внимание:** Это удалит конфиги всех клиентов, и настройки лоадера.
    color: 0xFF6B35

crash-logs:
    title: '📋 Как получить логи клиента'
    content: |
        1. **Нажмите правой кнопкой мыши на клиент**
           - Нажмите "Копировать логи"

    color: 0xE74C3C

installation:
    title: '📥 Установка CollapseLoader'
    content: |
        **Пошаговая установка:**

        1. **Скачайте лоадер:**
           - Официальный сайт: https://collapseloader.pages.dev

        2. **Первый запуск:**
           - Лоадер выполнит первоначальную настройку

        3. **Готово!**
           - Можете начинать использовать лоадер

        💡 **Совет:** Добавьте лоадер в исключения антивируса.
    color: 0x3498DB

technical-support:
    title: '🔧 Техническая поддержка'
    content: |
        **Перед обращением в поддержку:**

        **📋 Подготовьте информацию:**
        - Версия CollapseLoader
        - Логи ошибок (/snippet crash-logs)

        **🔍 Попробуйте сначала:**
        1. Перезапустить лоадер
        2. Очистить данные (/snippet data-clear)
        3. Проверить, не удалил ли антивирус файлы клиента

        **💬 Где получить помощь:**
        - <#1231330786481930347> - создание тикетов
        - Поиск по серверу (частые вопросы)

        **⚡ Быстрая помощь:**
        - Приложите скриншоты
        - Укажите что уже пробовали
    color: 0x9B59B6

clear-loader-files:
    title: ' 🧹 Очистка файлов лоадера'
    content: |
        **Как очистить файлы лоадера:**

        1. Зайдите в настройки лоадера
        2. Нажмите на кнопку "Сбросить файлы лоадера"
        3. После сообщения об успешной очистке, попробуйте снова запустить клиент
    color: 0x1ABC9C

not-loading:
    title: '❗ Лоадер/Клиенты не загружается'
    content: |
        **Если лоадер не запускается (зависает в экране загрузки, пишет что сервера офлайн)**
        1. Попробуйте включить DPI Bypass в настройках лоадера, после этого перезапустите лоадер **от администратора**
        2. Отключите фаервол на время запуска лоадера
        3. Проверьте, не блокирует ли ваш провайдер доступ к серверам лоадера: https://auth.collapseloader.pages.dev и https://cdn.collapseloader.pages.dev
        4. Попробуйте подключиться через VPN
        5. Если ничего не помогает, очистите данные лоадера (/snippet data-clear) и попробуйте снова
    color: 0xE67E22

client-download-stuck:
    title: '⏳ Загрузка клиента зависла'
    content: |
        **Если загрузка клиента зависла на 0 процентов:**

        1. Откройте настройки лоадера
        2. Включите опцию DPI Bypass
        3. Перезапустите лоадер от имени администратора
        4. Попробуйте снова скачать клиент
    color: 0x2980B9
